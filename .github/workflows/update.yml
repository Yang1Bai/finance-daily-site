name: Daily Financial Dashboard Update

on:
  schedule:
    # Pre-market: 08:00 ET (12:00 UTC) — every day
    - cron: '0 12 * * *'
    # Post-market: 18:00 ET (22:00 UTC) — weekdays only
    - cron: '0 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: daily-content-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CONTENT_MODE: public

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Test public source handling
        run: python -m unittest discover -s tests

      - name: Fetch & inject content
        run: python scripts/fetch_content.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html feed.xml data/ archive/
          git diff --cached --quiet || git commit -m "chore: daily update $(date -u +'%Y-%m-%d %H:%M UTC')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done

      - name: Request GitHub Pages rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py
