name: Daily Podcast Generation

on:
  workflow_run:
    workflows: ['Daily Financial Dashboard Update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: podcast-main
  cancel-in-progress: false

jobs:
  podcast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech tools
        timeout-minutes: 5
        run: |
          missing=()
          command -v espeak-ng >/dev/null || missing+=(espeak-ng)
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          if [ "${#missing[@]}" -gt 0 ]; then
            # Use only Ubuntu sources needed by speech tools.
            source_list=$(mktemp)
            printf '%s\n' \
              'deb https://archive.ubuntu.com/ubuntu noble main universe' \
              'deb https://archive.ubuntu.com/ubuntu noble-updates main universe' \
              'deb https://security.ubuntu.com/ubuntu noble-security main universe' > "$source_list"
            apt_options=(-o "Dir::Etc::sourcelist=$source_list" -o Dir::Etc::sourceparts=-
              -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20)
            sudo timeout 100 apt-get "${apt_options[@]}" update
            sudo timeout 160 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"
            rm -f "$source_list"
          fi
          espeak-ng --version
          ffmpeg -version
      - name: Generate source-based podcast
        run: python scripts/generate_podcast.py
      - name: Commit audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add audio/
          git diff --cached --quiet || git commit -m "podcast: source narration $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Request site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py
