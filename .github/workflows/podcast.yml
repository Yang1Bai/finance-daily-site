name: Daily Podcast Generation

on:
  workflow_run:
    workflows: ['Daily Financial Dashboard Update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: podcast-main
  cancel-in-progress: false

jobs:
  podcast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech tools
        run: sudo apt-get update -qq && sudo apt-get install -y espeak-ng ffmpeg
      - name: Generate source-based podcast
        run: python scripts/generate_podcast.py
      - name: Commit audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add audio/
          git diff --cached --quiet || git commit -m "podcast: source narration $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Request site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py
