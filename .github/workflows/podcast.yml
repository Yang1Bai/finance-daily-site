name: Daily Podcast Generation

on:
  workflow_run:
    workflows: ['Daily Financial Dashboard Update']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: podcast-main
  cancel-in-progress: false

jobs:
  podcast:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline speech tools
        timeout-minutes: 8
        run: |
          missing=()
          command -v espeak-ng >/dev/null || missing+=(espeak-ng)
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          if [ "${#missing[@]}" -gt 0 ]; then
            # Keep signed Ubuntu packages, but do not depend on one mirror.
            source_list=$(mktemp)
            trap 'rm -f "$source_list"' EXIT
            apt_options=(-o "Dir::Etc::sourcelist=$source_list" -o Dir::Etc::sourceparts=-
              -o Acquire::ForceIPv4=true -o Acquire::Retries=0
              -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15
              -o APT::Update::Error-Mode=any)
            installed=false
            for mirror in https://mirrors.edge.kernel.org/ubuntu https://ubuntu.osuosl.org/ubuntu https://mirror.math.princeton.edu/pub/ubuntu; do
              printf 'deb %s noble main universe\ndeb %s noble-updates main universe\ndeb %s noble-security main universe\n' \
                "$mirror" "$mirror" "$mirror" > "$source_list"
              if sudo timeout 60 apt-get "${apt_options[@]}" update && \
                 sudo timeout 80 apt-get "${apt_options[@]}" install -y --no-install-recommends "${missing[@]}"; then
                installed=true
                break
              fi
              echo "::warning::Speech dependency mirror unavailable; trying next source"
            done
            if [ "$installed" != true ]; then
              echo "::error::Unable to install offline speech tools from any mirror"
              exit 1
            fi
          fi
          espeak-ng --version
          ffmpeg -version
      - name: Generate source-based podcast
        run: python scripts/generate_podcast.py
      - name: Commit audio
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add audio/
          git diff --cached --quiet || git commit -m "podcast: source narration $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done
      - name: Request site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py
