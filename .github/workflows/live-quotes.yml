name: Live Quotes Update

on:
  schedule:
    # Every 30 min during US market hours (13:30-20:30 UTC = 9:30 AM - 4:30 PM ET), weekdays
    - cron: '*/30 13-20 * * 1-5'
    # After US market close (21:30 UTC = 17:30 ET), weekdays only
    - cron: '30 21 * * 1-5'
    # Weekend: once daily for Asian market reference
    - cron: '0 2 * * 0,6'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance

      - name: Fetch live quotes
        run: python scripts/fetch_quotes.py

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/quotes.json
          git diff --cached --quiet || git commit -m "chore: live quotes $(date -u +'%H:%M UTC')"
          git push
