name: AI Trading Decision

on:
  schedule:
    # 美东时间 16:30（20:30 UTC）收盘后运行，周一到周五
    - cron: '30 20 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  trading:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TRADING_MODE: rules

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install yfinance pytz

      - name: Run AI trading decisions
        run: python scripts/ai-trading-decision.py

      - name: Commit portfolio update
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ai-portfolio.json
          git diff --cached --quiet || git commit -m "chore: AI trading update $(date -u +'%Y-%m-%d')"
          for attempt in 1 2 3; do
            git pull --rebase origin main || exit 1
            if git push; then break; fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 3
          done

      - name: Request site rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/request_pages_build.py
